<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>AAO SOBHA | Agent Agréé Ooredoo</title>
    <meta name="description" content="Connect with AAO SOBHA, your approved Ooredoo agent, on social media or WhatsApp.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (() => {
            let theme = null;
            try { theme = localStorage.getItem('aao-sobha-theme'); } catch (_) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-decoration" aria-hidden="true"></div>

    <main class="container">
        <div class="top-controls">
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
                <i class="fa-solid fa-moon" aria-hidden="true"></i>
                <span>Dark mode</span>
            </button>
        </div>

        <header class="profile">
            <div class="profile-logo-wrap">
                <img
                    src="logo.webp"
                    alt="AAO SOBHA — Agent Agréé Ooredoo"
                    class="profile-logo"
                    fetchpriority="high"
                >
            </div>
            <h1 class="profile-name">AAO SOBHA</h1>
            <p class="profile-bio">Agent Agréé Ooredoo</p>
            <p class="profile-bio profile-bio-ar" lang="ar" dir="rtl">وكيل معتمد لدى أريدُ</p>
            <div class="brand-rule" aria-hidden="true"><span></span></div>
            <p class="profile-prompt">Connect with us</p>
        </header>

        <nav class="links-container" aria-label="AAO SOBHA links">
            <a href="https://www.tiktok.com/@aao.sobha" target="_blank" rel="noopener noreferrer" class="link-item tiktok-link">
                <span class="link-icon"><i class="fa-brands fa-tiktok" aria-hidden="true"></i></span>
                <span class="link-text">TikTok</span>
                <i class="fa-solid fa-arrow-up-right-from-square link-arrow" aria-hidden="true"></i>
            </a>

            <a href="https://www.instagram.com/aao_sobha" target="_blank" rel="noopener noreferrer" class="link-item instagram-link">
                <span class="link-icon"><i class="fa-brands fa-instagram" aria-hidden="true"></i></span>
                <span class="link-text">Instagram</span>
                <i class="fa-solid fa-arrow-up-right-from-square link-arrow" aria-hidden="true"></i>
            </a>

            <a href="https://www.facebook.com/aaosobha" target="_blank" rel="noopener noreferrer" class="link-item facebook-link">
                <span class="link-icon"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i></span>
                <span class="link-text">Facebook</span>
                <i class="fa-solid fa-arrow-up-right-from-square link-arrow" aria-hidden="true"></i>
            </a>

            <a href="https://wa.me/213557891148" target="_blank" rel="noopener noreferrer" class="link-item whatsapp-link">
                <span class="link-icon"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i></span>
                <span class="link-text">WhatsApp</span>
                <i class="fa-solid fa-arrow-up-right-from-square link-arrow" aria-hidden="true"></i>
            </a>

            <a href="mailto:aaosobha@gmail.com" class="link-item email-link">
                <span class="link-icon"><i class="fa-solid fa-envelope" aria-hidden="true"></i></span>
                <span class="link-text">Email us</span>
                <i class="fa-solid fa-arrow-up-right-from-square link-arrow" aria-hidden="true"></i>
            </a>
        </nav>

        <footer class="footer">
            <span class="footer-mark" aria-hidden="true"></span>
            <p>© <span id="year">2026</span> AAO SOBHA. All rights reserved.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
